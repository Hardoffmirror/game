<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoE Build Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>PoE Build Converter</h1>
            <div class="language-toggle">
                <button id="langToggle" class="lang-btn" title="Переключить язык">
                    <span class="lang-flag">🇬🇧</span>
                    <span class="lang-text">EN</span>
                </button>
            </div>
        </header>

        <div class="input-section">
            <textarea id="buildCode" placeholder="Вставьте код билда из Path of Building..."></textarea>
            <button id="parseBtn" class="btn">Парсить билд</button>
        </div>

        <div id="error" class="error"></div>
        <div id="loading" class="loading">Обработка...</div>

        <div id="results">
            <!-- Вещи -->
            <div class="section">
                <h2>Экипировка</h2>
                <div id="itemsList" class="items-grid"></div>
            </div>

            <!-- Самоцветы -->
            <div class="section">
                <h2>Самоцветы</h2>
                <div id="gemsList" class="gems-container"></div>
            </div>

            <!-- Фласки -->
            <div class="section">
                <h2>Фласки</h2>
                <div id="flasksList" class="items-grid"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
