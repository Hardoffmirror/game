<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoE Build Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>PoE Build Converter</h1>
            <p class="subtitle">Преобразование билдов из Path of Building</p>
        </header>

        <div class="input-section">
            <div class="builds-manager">
                <div class="saved-builds-selector">
                    <label for="savedBuildsSelect">Сохраненные билды:</label>
                    <select id="savedBuildsSelect">
                        <option value="">-- Выберите билд --</option>
                    </select>
                    <button id="renameBuildBtn" class="btn-secondary" disabled>Переименовать</button>
                    <button id="deleteBuildBtn" class="btn-danger" disabled>Удалить</button>
                </div>
            </div>
            <textarea id="buildCode" placeholder="Вставьте код билда из Path of Building..."></textarea>
            <div class="action-buttons">
                <button id="parseBtn" class="btn">Парсить билд</button>
                <button id="saveBuildBtn" class="btn-secondary">Сохранить билд</button>
            </div>
        </div>

        <!-- Модальное окно для сохранения билда -->
        <div id="saveBuildModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Сохранить билд</h2>
                    <span class="modal-close">&times;</span>
                </div>
                <div class="modal-body">
                    <label for="buildNameInput">Название билда:</label>
                    <input type="text" id="buildNameInput" placeholder="Например: Bleed Gladiator" maxlength="50">
                </div>
                <div class="modal-footer">
                    <button id="confirmSaveBtn" class="btn">Сохранить</button>
                    <button id="cancelSaveBtn" class="btn-secondary">Отмена</button>
                </div>
            </div>
        </div>

        <!-- Модальное окно для переименования билда -->
        <div id="renameBuildModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Переименовать билд</h2>
                    <span class="modal-close-rename">&times;</span>
                </div>
                <div class="modal-body">
                    <label for="buildRenameInput">Новое название билда:</label>
                    <input type="text" id="buildRenameInput" placeholder="Введите новое название" maxlength="50">
                </div>
                <div class="modal-footer">
                    <button id="confirmRenameBtn" class="btn">Переименовать</button>
                    <button id="cancelRenameBtn" class="btn-secondary">Отмена</button>
                </div>
            </div>
        </div>

        <div id="error" class="error"></div>
        <div id="loading" class="loading">Обработка...</div>

        <div id="results">
            <!-- Объединенная информация о билде и статистика -->
            <div id="buildInfoStats" class="build-info-stats-unified"></div>

            <!-- Экипировка -->
            <div class="section">
                <h2>Экипировка</h2>
                <p class="section-description">Оружие, броня и украшения</p>
                <div id="equipmentList" class="items-grid"></div>
            </div>

            <!-- Самоцветы (Jewels) -->
            <div class="section">
                <h2>Самоцветы (Jewels)</h2>
                <p class="section-description">Пассивные предметы в дереве талантов</p>
                <div id="jewelsList" class="items-grid"></div>
            </div>

            <!-- Фласки -->
            <div class="section">
                <h2>Фласки</h2>
                <p class="section-description">Зелья и бафы</p>
                <div id="flasksList" class="items-grid"></div>
            </div>

            <!-- Камни (Gems) - отдельная секция для компактного режима -->
            <div id="gemsCompactSection" class="gems-compact-section" style="display: none;">
                <div class="gems-compact-title">💎 Камни умений (Gems)</div>
                <div id="gemsCompactGrid" class="gems-compact-grid"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
