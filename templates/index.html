<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoE Build Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>PoE Build Converter</h1>
            <p class="subtitle">Преобразование билдов из Path of Building</p>
        </header>

        <div class="input-section">
            <textarea id="buildCode" placeholder="Вставьте код билда из Path of Building..."></textarea>
            <button id="parseBtn" class="btn">Парсить билд</button>
        </div>

        <div id="error" class="error"></div>
        <div id="loading" class="loading">Обработка...</div>

        <div id="results">
            <!-- Информация о билде и статистика -->
            <div class="build-stats-container">
                <div id="buildInfo" class="build-info-inline"></div>
                <div id="itemStats" class="item-stats-inline"></div>
            </div>

            <!-- Экипировка -->
            <div class="section">
                <h2>Экипировка</h2>
                <p class="section-description">Оружие, броня и украшения</p>
                <div id="equipmentList" class="items-grid"></div>
            </div>

            <!-- Самоцветы (Jewels) -->
            <div class="section">
                <h2>Самоцветы (Jewels)</h2>
                <p class="section-description">Пассивные предметы в дереве талантов</p>
                <div id="jewelsList" class="items-grid"></div>
            </div>

            <!-- Фласки -->
            <div class="section">
                <h2>Фласки</h2>
                <p class="section-description">Зелья и бафы</p>
                <div id="flasksList" class="items-grid"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
